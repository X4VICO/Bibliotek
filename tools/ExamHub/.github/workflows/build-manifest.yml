name: Regenerar manifest.json

# Se ejecuta cada vez que cambia algo dentro de /data (por ejemplo, cuando
# añades un tema nuevo). Regenera data/manifest.json y lo commitea solo si
# ha cambiado. Así, para publicar un tema nuevo basta con:
#   1. Añadir el JSON en data/<asignatura>/<tema>.json
#   2. git push
# ... y el catálogo de la web se actualiza solo, sin pasos manuales.

on:
  push:
    branches: [main]
    paths:
      - "data/**/*.json"
      - "!data/manifest.json"
      - "scripts/build_manifest.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generar manifest.json
        run: python3 scripts/build_manifest.py

      - name: Commitear si ha cambiado
        run: |
          if git diff --quiet -- data/manifest.json; then
            echo "manifest.json sin cambios, nada que commitear."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/manifest.json
          git commit -m "chore: regenerar manifest.json [skip ci]"
          git push
